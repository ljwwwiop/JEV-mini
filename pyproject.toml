[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-mini"
version = "0.1.0"
description = "Compact extraction of Kev decision-model training"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["torch>=2.6,<2.9", "transformers==4.57.6", "peft==0.18.0", "accelerate>=1.12.0", "pydantic>=2.9", "huggingface-hub", "PyYAML>=6.0", "tqdm>=4.66", "tensorboard>=2.14"]

[tool.setuptools]
packages = ["jev_mini"]
